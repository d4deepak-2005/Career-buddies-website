server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Receipt uploads (API limit is RECEIPT_MAX_BYTES, default 5 MB; multipart overhead needs headroom).
  client_max_body_size 8m;

  # API is same-origin so httpOnly SameSite=Strict cookies work.
  # Re-resolve the API's address through Docker's DNS every few seconds. A literal `proxy_pass http://server:4000`
  # is resolved only once at start-up, so after the API container is recreated or restarted with a new IP the
  # gateway kept returning 502 until it was restarted too.
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $api_upstream http://server:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }
}
